<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Add Business - Motherwell Local</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#f5f7fb;padding:16px}.top{background:#0a68d1;color:#fff;padding:14px;border-radius:12px;margin-bottom:16px}
input,select,textarea{width:100%;padding:14px;margin-bottom:12px;border-radius:10px;border:1px solid #e2e8f0}
button{width:100%;padding:16px;background:#ffcc00;border:none;border-radius:30px;font-weight:700;font-size:16px}
</style></head><body>
<div class="top"><a href="index.html" style="color:#fff;text-decoration:none">‹ Back</a><h3 style="margin-top:8px">Add Your Business</h3></div>
<input id="name" placeholder="Business Name (e.g. Siya's Cowfeet)">
<select id="cat"><option>Food & Drinks</option><option>Barbers</option><option>Hair & Beauty</option><option>Nails</option><option>Car Wash</option><option>Tyres</option><option>Mechanics</option><option>Spaza Shops</option></select>
<input id="area" placeholder="Area (e.g. Kamvelihle, NU5)">
<input id="phone" placeholder="WhatsApp Number (e.g. 0826613785)">
<textarea id="desc" placeholder="What do you sell?"></textarea>
<button onclick="submitBiz()">Submit via WhatsApp</button>
<script>
function submitBiz(){
let n=document.getElementById('name').value;
let c=document.getElementById('cat').value;
let a=document.getElementById('area').value;
let d=document.getElementById('desc').value;
if(!n)return alert('Enter business name');
let msg=`NEW BUSINESS%0AName: ${n}%0ACategory: ${c}%0AArea: ${a}%0ADesc: ${d}`;
window.open(`https://wa.me/27826613785?text=${msg}`,'_blank');
}
</script></body></html>
